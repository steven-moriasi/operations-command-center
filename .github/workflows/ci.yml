name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=moderate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: operations-command-center:test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start command center
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify workflow controls and audit
        run: |
          curl --fail --silent --show-error http://localhost:3000/api/health
          curl --fail --silent --show-error http://localhost:3000/api/ready
          curl --fail --silent --show-error http://localhost:3000/api/dashboard |
            jq -e '.source == "database" and (.executions | length == 4)'
          curl --fail --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --header 'idempotency-key: ci-retry-supplier-intake' \
            --data '{"action":"retry","expectedVersion":3}' \
            http://localhost:3000/api/executions/run-01J7YN/actions |
            jq -e '.execution.status == "queued" and .execution.version == 4 and .replayed == false'
          curl --fail --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --header 'idempotency-key: ci-retry-supplier-intake' \
            --data '{"action":"retry","expectedVersion":3}' \
            http://localhost:3000/api/executions/run-01J7YN/actions |
            jq -e '.replayed == true'
          curl --fail --silent --show-error http://localhost:3000/api/audit |
            jq -e '.[0].action == "execution.retry"'
          curl --fail --silent --show-error http://localhost:3000/api/metrics |
            grep -q command_center_execution_actions_total
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop command center
        if: always()
        run: docker compose down --volumes
